<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found | Avora Digital</title>
  <meta name="description" content="The page you're looking for could not be found. Return to Avora Digital and explore our Shopify, web development, digital marketing and branding services.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0B0D10">

    <!-- Favicon -->
<link rel="icon" href="assets/favicon/avoradigital-favicon-16-16.png" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/avoradigital-favicon-32-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/avoradigital-favicon-16-16.png">

<!-- Apple Touch Icon -->
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/avoradigital-favicon-16-16.png">


  <link rel="canonical" href="https://avoradigital.online/404.html">
  <link rel="stylesheet" href="/css/style.css">

  <style>
    .error-page{
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:110px 20px 50px;
      position:relative;
      overflow:hidden;
    }

    .error-grid{
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:.45;
      background-image:
        linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
      background-size:80px 80px;
      mask-image:linear-gradient(to bottom, black, transparent 92%);
    }

    .error-orbit{
      position:absolute;
      width:min(70vw,850px);
      aspect-ratio:1;
      right:-25%;
      top:-20%;
      border:1px solid rgba(199,240,0,.12);
      border-radius:50%;
      pointer-events:none;
    }

    .error-card{
      position:relative;
      z-index:2;
      width:min(760px,100%);
      text-align:center;
      padding:60px 35px;
      border:1px solid var(--color-border);
      border-radius:28px;
      background:rgba(20,24,29,.72);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      box-shadow:var(--shadow);
    }

    .error-code{
      margin:0 0 8px;
      color:var(--color-accent);
      font:800 clamp(90px,18vw,190px)/.82 "Manrope",sans-serif;
      letter-spacing:-.08em;
    }

    .error-card h1{
      margin:30px 0 15px;
      font-size:clamp(32px,5vw,54px);
    }

    .error-card p{
      max-width:560px;
      margin:0 auto 30px;
      font-size:16px;
    }

    .error-actions{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:12px;
    }

    .error-footer{
      position:absolute;
      z-index:2;
      bottom:25px;
      left:20px;
      right:20px;
      display:flex;
      justify-content:center;
      color:var(--color-muted);
      font-size:11px;
    }

    @media(max-width:560px){
      .error-card{
        padding:45px 22px;
      }

      .error-actions{
        display:grid;
      }

      .error-actions .btn{
        width:100%;
      }
    }
  </style>
</head>

<body>

  <main class="error-page">
    <div class="error-grid" aria-hidden="true"></div>
    <div class="error-orbit" aria-hidden="true"></div>

    <section class="error-card" aria-labelledby="error-title">
      <div class="brand" style="justify-content:center;">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span class="brand-name">Avora<span>Digital</span></span>
      </div>

      <p class="error-code" aria-hidden="true">404</p>

      <h1 id="error-title">This page doesn't exist.</h1>

      <p>
        The page may have moved, the URL may be incorrect, or the content
        you're looking for is no longer available.
      </p>

      <div class="error-actions">
        <a class="btn btn-primary" href="/">Back to Home <span>↗</span></a>
        <a class="btn btn-secondary" href="/contact.html">Start a Project <span>↗</span></a>
      </div>
    </section>

    <div class="error-footer">
      © 2026 Avora Digital. Build. Market. Scale. Brand.
    </div>
  </main>

</body>
</html>
